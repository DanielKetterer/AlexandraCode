<!DOCTYPE html>
<!--
  Red Light, Green Light (for Alexandra)
  ---------------------------------------------------------------
  One-file game. Music plays on GREEN, stops on RED. Move while it
  plays, freeze in your bubble when it stops.

  What it's for:
    - Rhythm:  steady, simple songs; the picture moves exactly on the beat.
    - Stop/go: the music stopping is the cue to freeze. Same picture in
               both states - moving vs still - so the contrast is the lesson.
    - Personal space: on RED a "bubble" ring breathes around the picture.
               Grown-up models it: arms out in a circle, "this is my bubble",
               hug yourself, hold still.

  Songs (all synthesized live with Web Audio, so they work offline):
    Frog Hop      original, bouncy, 4/4, form AABA (16 bars)
    Twinkle       "Twinkle Twinkle Little Star" (public domain, 1761 tune),
                  music-box sound, form ABA (12 bars)
    Rocking Boat  original slow waltz in 3/4, the boat sways instead of
                  bouncing, form AABA (32 short bars)
    Each song plays its form twice; the second time adds a harmony line
    under the melody, so nothing repeats exactly for a minute or more.
    Stopping is a pause button: green picks up right where red froze it.

  Modes:
    Tap  - grown-up controls it. Tap anywhere: go / stop.
    Auto - runs itself: several bars of green, one yellow "get ready" bar
           (melody drops out, just the beat), then a short red freeze.
           Tapping in Auto plays a clap, so she can play along.
  Tempo: Slow / Mid / Fast scales each song's own speed.

  EDITING A SONG (see SONGS below):
    Each bar is  [ "chord(s)", "melody" ].
    Chords: "C", "Am", or two per bar split in half: "F C".
    Melody: one token per eighth note.  A note like E5 starts a note
            (C4 = middle C), "." holds the previous note one more eighth,
            "_" is silence.  4/4 bars have 8 tokens, 3/4 bars have 6.

  Link: https://DanielKetterer.github.io/AlexandraCode/redlight.html
  ---------------------------------------------------------------
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0b0f">
<title>Red Light Green Light</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #0b0b0f;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5vh;
    padding-top: 70px;
    box-sizing: border-box;
    background: #1c1c26;
    transition: background-color 0.25s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    cursor: pointer;
  }
  body[data-state="green"]  #stage { background: #1fa855; }
  body[data-state="yellow"] #stage { background: #f2b705; }
  body[data-state="red"]    #stage { background: #e0302b; }

  #light {
    position: relative;
    width: min(60vw, 40vh);
    height: min(60vw, 40vh);
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    will-change: transform;
    --amp: 1.13;
    --lift: -5%;
  }
  #face {
    font-size: min(30vw, 20vh);
    line-height: 1;
    pointer-events: none;
    text-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
  }

  /* Bounce on every beat (duration and size set from JS) */
  #light.beat { animation: beat var(--beat, 0.6s) cubic-bezier(.2,.7,.3,1); }
  @keyframes beat {
    0%   { transform: scale(var(--amp)) translateY(var(--lift)); }
    100% { transform: scale(1) translateY(0); }
  }
  #light.hit { animation: hit 0.18s ease-out; }
  @keyframes hit {
    0%   { filter: brightness(1.6); }
    100% { filter: brightness(1); }
  }

  /* The personal-space bubble: only visible on red, breathes slowly */
  #bubble {
    position: absolute;
    inset: -12%;
    border-radius: 50%;
    border: max(6px, 1.3vmin) solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 30px rgba(255, 255, 255, 0.35);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  body[data-state="red"] #bubble {
    opacity: 1;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.1); }
  }

  #word {
    font-size: min(11vw, 7vh);
    font-weight: 900;
    letter-spacing: 3px;
    color: #fff;
    text-transform: uppercase;
    text-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    pointer-events: none;
  }

  #bar {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: 8px;
    right: 8px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px;
    z-index: 2;
    pointer-events: none;
  }
  .group {
    display: flex;
    gap: 3px;
    padding: 4px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.25);
    pointer-events: auto;
  }
  .chip {
    border: none;
    border-radius: 999px;
    padding: 8px 12px;
    font: 700 14px system-ui, -apple-system, sans-serif;
    background: transparent;
    color: rgba(255, 255, 255, 0.85);
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .chip.on { background: #fff; color: #111; }

  @media (prefers-reduced-motion: reduce) {
    #light.beat, #light.hit { animation: none; }
    body[data-state="red"] #bubble { animation: none; }
  }
</style>
</head>
<body data-state="idle">

<div id="bar">
  <div class="group" id="songs">
    <button class="chip on" data-song="frog">🐸 Frog</button>
    <button class="chip" data-song="star">⭐ Star</button>
    <button class="chip" data-song="boat">⛵ Boat</button>
  </div>
  <div class="group" id="modes">
    <button class="chip on" data-mode="tap">Tap</button>
    <button class="chip" data-mode="auto">Auto</button>
  </div>
  <div class="group" id="tempos">
    <button class="chip" data-tempo="0.85">Slow</button>
    <button class="chip on" data-tempo="1">Mid</button>
    <button class="chip" data-tempo="1.15">Fast</button>
  </div>
</div>

<div id="stage">
  <div id="light"><div id="bubble"></div><span id="face">🐸</span></div>
  <div id="word">Tap to play</div>
</div>

<script>
"use strict";

/* =====================================================================
   SONGS
   ===================================================================== */
var SONGS = {

  /* ---- Frog Hop: bouncy, original. A = I-V-vi-IV, B = higher, ends on G
         so the return to A feels like coming home. ---- */
  frog: {
    name: "Frog Hop", face: "🐸", bpm: 100, beats: 4,
    voice: "marimba", drums: "bounce", accomp: "bounce", move: "bounce",
    amp: 1.13, lift: -5,
    sections: {
      A1: [
        ["C",     "E5 . G5 G5 A5 . G5 ."],
        ["G",     "D5 . E5 . G5 . . _"],
        ["Am",    "C5 . D5 . E5 E5 G5 ."],
        ["F",     "A5 . G5 . F5 . . _"]          // A-G-F, then E on the downbeat
      ],
      A2: [
        ["C",     "E5 . G5 G5 A5 . G5 ."],
        ["G",     "D5 . E5 . G5 . . _"],
        ["Am",    "C5 . D5 . E5 E5 G5 ."],
        ["F",     "A5 . G5 . A5 . C6 ."]          // climbs up into B
      ],
      B: [
        ["F",     "C6 . . . A5 . C6 ."],
        ["G",     "D6 . . . B5 . G5 ."],
        ["Em Am", "B5 . G5 . A5 . C6 ."],
        ["F G",   "A5 . . . G5 . D5 .", "fill"]   // drum fill, then home
      ]
    },
    form: ["A1", "A2", "B", "A1"]
  },

  /* ---- Twinkle Twinkle Little Star (traditional, public domain) ---- */
  star: {
    name: "Twinkle", face: "⭐", bpm: 92, beats: 4,
    voice: "musicbox", drums: "gentle", accomp: "alberti", move: "bounce",
    amp: 1.08, lift: -3,
    sections: {
      A: [
        ["C",   "C5 . C5 . G5 . G5 ."],     // Twin-kle twin-kle
        ["F C", "A5 . A5 . G5 . . ."],      // lit-tle star
        ["F C", "F5 . F5 . E5 . E5 ."],     // how I won-der
        ["G C", "D5 . D5 . C5 . . ."]       // what you are
      ],
      B: [
        ["C G", "G5 . G5 . F5 . F5 ."],     // Up a-bove the
        ["C G", "E5 . E5 . D5 . . ."],      // world so high
        ["C G", "G5 . G5 . F5 . F5 ."],     // Like a dia-mond
        ["C G", "E5 . E5 . D5 . . ."]       // in the sky
      ]
    },
    form: ["A", "B", "A"]
  },

  /* ---- Rocking Boat: slow original waltz in 3/4. A1 ends open (on G),
         A2 ends closed (on C), B is the high wave in the middle. ---- */
  boat: {
    name: "Rocking Boat", face: "⛵", bpm: 132, beats: 3,
    voice: "flute", drums: "waltz", accomp: "waltz", move: "sway",
    sections: {
      A1: [
        ["C",  "E5 . . . G5 ."],
        ["C",  "C6 . . . G5 ."],
        ["F",  "A5 . . . C6 ."],
        ["C",  "G5 . . . . ."],
        ["Am", "E5 . . . A5 ."],
        ["F",  "A5 . G5 . F5 ."],
        ["G",  "D5 . E5 . F5 ."],
        ["G",  "G5 . . . . ."]
      ],
      A2: [
        ["C",  "E5 . . . G5 ."],
        ["C",  "C6 . . . G5 ."],
        ["F",  "A5 . . . C6 ."],
        ["C",  "G5 . . . . ."],
        ["Am", "E5 . . . A5 ."],
        ["F",  "A5 . G5 . F5 ."],
        ["G",  "D5 . . . B4 ."],
        ["C",  "C5 . . . . ."]
      ],
      B: [
        ["Am", "A5 . . . C6 ."],
        ["Am", "E6 . . . C6 ."],
        ["F",  "C6 . . . A5 ."],
        ["F",  "F5 . . . . ."],
        ["C",  "G5 . . . E5 ."],
        ["Am", "A5 . . . E5 ."],
        ["Dm", "F5 . . . A5 ."],
        ["G",  "B5 . A5 . G5 ."]
      ]
    },
    form: ["A1", "A2", "B", "A2"]
  }
};

/* =====================================================================
   Song compiler: turns the readable song text into per-eighth-note data
   ===================================================================== */
var PC = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function parseNote(tok) {
  var m = /^([A-G])([#b]?)(-?\d)$/.exec(tok);
  if (!m) { throw new Error("Bad note: " + tok); }
  var acc = m[2] === "#" ? 1 : (m[2] === "b" ? -1 : 0);
  return 12 * (Number(m[3]) + 1) + PC[m[1]] + acc;
}
function placeIn(pc, lo) {             // pitch class -> first MIDI note >= lo
  var n = lo + ((pc - lo) % 12 + 12) % 12;
  return n;
}
function parseChord(name) {
  var m = /^([A-G])([#b]?)(m?)$/.exec(name);
  if (!m) { throw new Error("Bad chord: " + name); }
  var r = (PC[m[1]] + (m[2] === "#" ? 1 : m[2] === "b" ? -1 : 0) + 12) % 12;
  var third = m[3] ? 3 : 4;
  var pcs = [r, (r + third) % 12, (r + 7) % 12];
  var r4 = placeIn(r, 60);
  return {
    name: name,
    pcs: pcs,
    bass: placeIn(r, 40),                          // E2..D#3
    alb: [r4, r4 + third, r4 + 7],                 // root, third, fifth (octave 4)
    stab: pcs.map(function (p) { return placeIn(p, 55); }).sort(function (a, b) { return a - b; })
  };
}

function compile(song) {
  var spb = song.beats * 2;                       // eighth-note slots per bar
  var formBars = [];
  song.form.forEach(function (sec) {
    song.sections[sec].forEach(function (b) { formBars.push(b); });
  });
  var bars = [];
  for (var pass = 0; pass < 2; pass++) {
    formBars.forEach(function (b, i) {
      var toks = b[1].trim().split(/\s+/);
      if (toks.length !== spb) {
        console.warn(song.name + ": bar " + (i + 1) + " has " + toks.length + " slots, expected " + spb);
      }
      var notes = new Array(spb).fill(null);
      for (var s = 0; s < spb; s++) {
        var t = toks[s];
        if (!t || t === "." || t === "_") { continue; }
        var len = 1;
        while (toks[s + len] === ".") { len++; }
        notes[s] = { midi: parseNote(t), len: len };
      }
      bars.push({
        chords: b[0].trim().split(/\s+/).map(parseChord),
        notes: notes,
        fill: b[2] === "fill" || i === formBars.length - 1,
        pass: pass
      });
    });
  }
  return {
    song: song, spb: spb, bars: bars, total: bars.length * spb,
    name: song.name, face: song.face, bpm: song.bpm, beats: song.beats,
    voice: song.voice, drums: song.drums, accomp: song.accomp, move: song.move,
    amp: song.amp || 1.1, lift: song.lift || -4
  };
}

var COMPILED = {};
Object.keys(SONGS).forEach(function (k) { COMPILED[k] = compile(SONGS[k]); });

/* Harmony for the second pass: the highest chord tone a 3rd-6th below
   the melody note (skipping the tritone), so it is always consonant. */
var HARM_GAPS = [3, 4, 5, 7, 8, 9];
function harmonyNote(m, chord) {
  for (var i = 0; i < HARM_GAPS.length; i++) {
    var h = m - HARM_GAPS[i];
    if (chord.pcs.indexOf(((h % 12) + 12) % 12) !== -1) { return h; }
  }
  return null;
}

/* =====================================================================
   Audio
   ===================================================================== */
var actx = null, musicBus = null, cueBus = null, noiseBuf = null, seg = null;
function ctx() {
  if (!actx) {
    var AC = window.AudioContext || window.webkitAudioContext;
    actx = new AC();
    var comp = actx.createDynamicsCompressor();     // keeps stacked notes from clipping
    comp.threshold.value = -14; comp.ratio.value = 4;
    comp.connect(actx.destination);
    musicBus = actx.createGain(); musicBus.connect(comp);
    cueBus   = actx.createGain(); cueBus.connect(comp);
    var len = Math.floor(actx.sampleRate * 0.5);
    noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
    var d = noiseBuf.getChannelData(0);
    for (var i = 0; i < len; i++) { d[i] = Math.random() * 2 - 1; }
  }
  if (actx.state === "suspended") { actx.resume(); }
  return actx;
}

/* Every stretch of green gets its own "segment" gain. Red cuts it, which
   silences everything already booked on it - nothing leaks into the freeze. */
function newSeg(t) {
  seg = actx.createGain();
  seg.gain.setValueAtTime(1, t);
  seg.connect(musicBus);
}
function cutSeg(t) {
  if (!seg) { return; }
  var s = seg;
  s.gain.setValueAtTime(1, t);
  s.gain.setTargetAtTime(0, t, 0.015);
  setTimeout(function () { try { s.disconnect(); } catch (e) {} }, Math.max(0, t - actx.currentTime + 1) * 1000);
}

function mtof(m) { return 440 * Math.pow(2, (m - 69) / 12); }

/* Percussive tone: fast attack, exponential decay */
function tone(freq, t, dur, gain, type, bus) {
  var o = actx.createOscillator();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, t);
  var g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(gain, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(bus || seg);
  o.start(t); o.stop(t + dur + 0.03);
}
/* Sustained tone with soft attack and gentle vibrato (the flute) */
function held(freq, t, dur, gain) {
  var o = actx.createOscillator();
  o.type = "sine";
  o.frequency.setValueAtTime(freq, t);
  var o2 = actx.createOscillator();          // a little breath of overtone
  o2.type = "triangle";
  o2.frequency.setValueAtTime(freq * 2, t);
  var g2 = actx.createGain(); g2.gain.value = 0.12;
  var vib = actx.createOscillator(); vib.frequency.value = 5;
  var vg = actx.createGain();
  vg.gain.setValueAtTime(0, t);
  vg.gain.linearRampToValueAtTime(freq * 0.006, t + Math.min(0.4, dur));
  vib.connect(vg); vg.connect(o.frequency);
  var g = actx.createGain();
  var hold = Math.max(0.08, dur - 0.05);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(gain, t + 0.06);
  g.gain.setValueAtTime(gain * 0.85, t + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + hold + 0.18);
  o.connect(g); o2.connect(g2); g2.connect(g); g.connect(seg);
  var end = t + hold + 0.22;
  o.start(t); o2.start(t); vib.start(t);
  o.stop(end); o2.stop(end); vib.stop(end);
}

function voice(kind, m, t, dur, vel) {
  var f = mtof(m);
  if (kind === "marimba") {
    tone(f, t, Math.min(0.6, dur + 0.25), 0.22 * vel, "sine");
    tone(f * 4, t, 0.07, 0.05 * vel, "sine");          // mallet tick
  } else if (kind === "musicbox") {
    tone(f, t, 1.3, 0.2 * vel, "sine");
    tone(f * 3, t, 0.35, 0.035 * vel, "sine");         // tine shimmer
    tone(f * 5.95, t, 0.12, 0.02 * vel, "sine");
  } else {
    held(f, t, dur, 0.17 * vel);
  }
}

function bass(m, t, gain) { tone(mtof(m), t, 0.45, gain, "triangle"); }
function kick(t, gain) {
  var o = actx.createOscillator();
  o.frequency.setValueAtTime(150, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  var g = actx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(g); g.connect(seg);
  o.start(t); o.stop(t + 0.22);
}
function noise(t, dur, gain, freq, kind, bus) {
  var s = actx.createBufferSource(); s.buffer = noiseBuf;
  var f = actx.createBiquadFilter(); f.type = kind; f.frequency.value = freq;
  var g = actx.createGain();
  g.gain.setValueAtTime(gain, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(bus || seg);
  s.start(t); s.stop(t + dur + 0.02);
}
function hat(t, gain)        { noise(t, 0.04, gain, 7000, "highpass"); }
function shaker(t, gain)     { noise(t, 0.08, gain, 5000, "highpass"); }
function clap(t, gain, bus)  { noise(t, 0.12, gain, 1400, "bandpass", bus); }

/* Cues: "ba-da-DING" up for go, "boo-boop" down for stop, soft bell for ready */
function goCue(t)    { [60, 64, 67, 72].forEach(function (m, i) { tone(mtof(m), t + i * 0.07, 0.25, 0.25, "triangle", cueBus); }); }
function stopCue(t)  { tone(mtof(67), t, 0.22, 0.32, "square", cueBus); tone(mtof(60), t + 0.2, 0.35, 0.32, "square", cueBus); }
function readyCue(t) { tone(mtof(84), t, 0.6, 0.18, "sine", cueBus); tone(mtof(84), t + 0.3, 0.6, 0.18, "sine", cueBus); }

/* ---------- One eighth-note slot of the song ---------- */
function drums(slot, t, bar) {
  var d = S.drums;
  if (d === "bounce") {
    if (bar.fill && slot >= 4) {                       // eighth-note clap roll into the next section
      if (slot === 4) { kick(t, 0.9); }
      clap(t, 0.2 + 0.06 * (slot - 4));
      hat(t, 0.12);
      return;
    }
    if (slot === 0 || slot === 4) { kick(t, 0.9); }
    if (slot === 2 || slot === 6) { clap(t, 0.35); }
    hat(t, slot % 2 === 0 ? 0.12 : 0.06);
  } else if (d === "gentle") {
    if (slot === 0) { kick(t, 0.5); }
    if (slot % 2 === 0) { hat(t, 0.05); }
    if (bar.fill && slot >= 6) { clap(t, 0.16); }
  } else {                                             // waltz: boom - tss - tss
    if (slot === 0) { kick(t, 0.45); }
    if (slot === 2 || slot === 4) { shaker(t, 0.07); }
  }
}

function accomp(slot, t, chord) {
  var a = S.accomp;
  if (a === "bounce") {
    if (slot === 0 || slot === 4) { bass(chord.bass, t, 0.3); }
    if (slot === 6) { bass(chord.bass + 12, t, 0.14); }    // little octave hop
  } else if (a === "alberti") {
    if (slot === 0 || slot === 4) { bass(chord.bass, t, 0.24); }
    var pat = [0, 2, 1, 2];                                  // root, fifth, third, fifth
    tone(mtof(chord.alb[pat[slot % 4]]), t, 0.4, 0.05, "sine");
  } else {                                                   // oom - pah - pah
    if (slot === 0) { bass(chord.bass, t, 0.26); }
    if (slot === 2 || slot === 4) {
      chord.stab.forEach(function (m) { tone(mtof(m), t, 0.3, 0.045, "triangle"); });
    }
  }
}

function playSlot(p, t) {
  var spb = S.spb, slot = p % spb, bar = S.bars[Math.floor(p / spb)];
  var chord = bar.chords[(bar.chords.length > 1 && slot >= spb / 2) ? 1 : 0];
  drums(slot, t, bar);
  accomp(slot, t, chord);
  var n = bar.notes[slot];
  if (n) {
    var dur = n.len * eighth();
    voice(S.voice, n.midi, t, dur, 1);
    if (bar.pass === 1) {
      var h = harmonyNote(n.midi, chord);
      if (h != null) { voice(S.voice, h, t, dur, 0.5); }
    }
  }
  if (slot % 2 === 0) { queue(t, "beat", slot === 0); }
}

/* The yellow "get ready" bar: just the heartbeat, song position does not move */
function yellowSlot(slot, t) {
  if (slot % 2 === 0) { kick(t, S.drums === "bounce" ? 0.8 : 0.5); }
  hat(t, slot % 2 === 0 ? 0.08 : 0.04);
  if (slot % 2 === 0) { queue(t, "beat", slot === 0); }
}

/* =====================================================================
   Scheduler (look-ahead on the audio clock, so timing never drifts)
   ===================================================================== */
var S = COMPILED.frog;
var tempoMul = 1;
var mode = "tap";
var GREEN_SECONDS = [5, 12];       // auto: how long the music runs
var RED_SECONDS = [2.5, 4.5];      // auto: how long the freeze lasts
var LOOK = 0.12;

function bpm()    { return S.bpm * tempoMul; }
function eighth() { return 60 / bpm() / 2; }
function barSec() { return S.beats * 60 / bpm(); }
function rand(a, b) { return a + Math.random() * (b - a); }

var pos = 0;              // where we are in the song, in eighth-note slots
var playing = false, timer = null, nextTime = 0;
var phase = "idle";
var yellowLeft = 0, barsLeft = 0, redTimeout = null;
var pending = [];         // song slots booked but maybe not yet heard: {pos, t}
var events = [];          // visual events waiting for the audio clock

function queue(t, type, down) { events.push({ t: t, type: type, down: down }); }

function schedule() {
  var spb = S.spb;
  while (pending.length && pending[0].t < actx.currentTime - 1) { pending.shift(); }
  while (playing && nextTime < actx.currentTime + LOOK) {
    var t = nextTime;
    if (yellowLeft > 0) {
      yellowSlot(spb - yellowLeft, t);
      yellowLeft--;
      nextTime += eighth();
      if (yellowLeft === 0) { endYellow(nextTime); }
      continue;
    }
    if (mode === "auto" && pos % spb === 0) {
      if (barsLeft <= 0) {
        yellowLeft = spb;
        readyCue(t); queue(t, "yellow");
        phase = "yellow";
        continue;
      }
      barsLeft--;
    }
    playSlot(pos, t);
    pending.push({ pos: pos, t: t });
    pos = (pos + 1) % S.total;
    nextTime += eighth();
  }
}

function endYellow(t) {
  stopAudio(t);
  stopCue(t); queue(t, "red");
  phase = "red";
  var wait = (t - actx.currentTime) + rand(RED_SECONDS[0], RED_SECONDS[1]);
  redTimeout = setTimeout(goGreen, wait * 1000);
}

function stopAudio(t) {
  playing = false;
  clearInterval(timer);
  cutSeg(t);
}

/* ---------- Transitions ---------- */
function goGreen() {
  var c = ctx();
  clearTimeout(redTimeout);
  var now = c.currentTime;
  goCue(now);
  newSeg(now);
  phase = "green"; yellowLeft = 0;
  if (mode === "auto") {
    pos -= pos % S.spb;                        // auto always resumes on a bar line
    barsLeft = Math.max(2, Math.round(rand(GREEN_SECONDS[0], GREEN_SECONDS[1]) / barSec()));
  }
  pending = []; events = [];
  nextTime = now + 0.3;                        // let the go-cue land, then the music
  setState("green");
  playing = true;
  clearInterval(timer);
  timer = setInterval(schedule, 25);
  schedule();
  keepAwake();
}

function goRed() {                              // immediate stop (Tap mode)
  var now = ctx().currentTime;
  clearTimeout(redTimeout);
  // Resume point = the first booked slot that hasn't started sounding yet
  for (var i = 0; i < pending.length; i++) {
    if (pending[i].t > now) { pos = pending[i].pos; break; }
  }
  pending = []; events = [];
  stopAudio(now);
  stopCue(now);
  phase = "red";
  setState("red");
}

function goIdle(resetSong) {
  if (actx) { stopAudio(actx.currentTime); }
  clearTimeout(redTimeout);
  pending = []; events = []; yellowLeft = 0;
  if (resetSong) { pos = 0; }
  phase = "idle";
  setState("idle");
}

/* =====================================================================
   Visuals
   ===================================================================== */
var light = document.getElementById("light");
var face  = document.getElementById("face");
var word  = document.getElementById("word");
var WORDS = { idle: "Tap to play", green: "Go!", yellow: "Get ready", red: "Freeze" };
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
var swayDir = 1;

function setState(s) {
  document.body.setAttribute("data-state", s);
  word.textContent = WORDS[s];
  if (s === "red") { freezeMotion(); }
  if (s === "idle") { resetMotion(true); }
}

function pulse(cls) {
  light.classList.remove("beat", "hit");
  void light.offsetWidth;                       // restart the animation
  light.classList.add(cls);
}
light.addEventListener("animationend", function () { light.classList.remove("beat", "hit"); });

function bounce(down) {
  light.style.setProperty("--beat", (60 / bpm()) + "s");
  var amp = down ? S.amp + 0.03 : S.amp;
  light.style.setProperty("--amp", String(amp));
  light.style.setProperty("--lift", S.lift + "%");
  pulse("beat");
}
function sway() {                               // one lean per bar, alternating sides
  if (reduceMotion) { return; }
  swayDir = -swayDir;
  light.style.transition = "transform " + barSec() + "s ease-in-out";
  light.style.transform = "rotate(" + (swayDir * 10) + "deg) translateX(" + (swayDir * 8) + "%)";
}
function freezeMotion() {                       // stop exactly where it is, mid-lean
  if (S.move !== "sway") { return; }
  var cur = getComputedStyle(light).transform;
  light.style.transition = "none";
  light.style.transform = (cur && cur !== "none") ? cur : "";
}
function resetMotion(animate) {
  light.style.transition = animate ? "transform 0.5s ease" : "none";
  light.style.transform = "";
}

function frame() {
  if (actx) {
    var now = actx.currentTime;
    while (events.length && events[0].t <= now) {
      var ev = events.shift();
      if (ev.type === "beat") {
        if (S.move === "sway") { if (ev.down) { sway(); } }
        else { bounce(ev.down); }
      } else {
        setState(ev.type);
      }
    }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* =====================================================================
   Input
   ===================================================================== */
var lastTap = 0;
document.getElementById("stage").addEventListener("pointerdown", function (e) {
  e.preventDefault();
  var t = Date.now();
  if (mode === "tap") {
    if (t - lastTap < 350) { return; }          // mash guard
    lastTap = t;
    if (phase === "green") { goRed(); } else { goGreen(); }
  } else {
    if (phase === "idle") { goGreen(); return; }
    clap(ctx().currentTime, 0.35, cueBus);       // play-along clap
    pulse("hit");
  }
});

function pick(groupId, attr, onPick) {
  var chips = document.querySelectorAll("#" + groupId + " .chip");
  chips.forEach(function (b) {
    b.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      chips.forEach(function (x) { x.classList.toggle("on", x === b); });
      onPick(b.getAttribute(attr));
    });
  });
}
pick("songs", "data-song", function (k) {
  goIdle(true);
  S = COMPILED[k];
  face.textContent = S.face;
  resetMotion(false);
});
pick("modes", "data-mode", function (m) { mode = m; goIdle(false); });
pick("tempos", "data-tempo", function (v) { tempoMul = Number(v); });

/* Keep the screen on while playing (where supported) */
var lock = null;
function keepAwake() {
  try {
    if (!lock && navigator.wakeLock) {
      navigator.wakeLock.request("screen").then(function (l) {
        lock = l; l.addEventListener("release", function () { lock = null; });
      }).catch(function () {});
    }
  } catch (e) {}
}
document.addEventListener("visibilitychange", function () {
  if (document.hidden && phase !== "idle") { goIdle(false); }
});

window.addEventListener("contextmenu", function (e) { e.preventDefault(); });
</script>
</body>
</html>
